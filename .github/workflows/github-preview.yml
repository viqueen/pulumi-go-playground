name: github preview

on:
  pull_request:
    paths:
      - "github/**"
      - ".github/workflows/github-preview.yml"
  push:
    branches: [main]
    paths:
      - "github/**"
      - ".github/workflows/github-preview.yml"

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: github/go.mod
      - uses: pulumi/actions@v6
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        with:
          command: preview
          stack-name: dev
          work-dir: github
          cloud-url: file://~
          upsert: true

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: github/go.mod
      - name: go build
        working-directory: github
        run: go build -a -v -o dist/infra .
